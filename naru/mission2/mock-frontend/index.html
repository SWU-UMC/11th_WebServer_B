<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UMC Movie | API Test</title>
    <style>
      * { box-sizing: border-box; }
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202020; background: #fafafa; }
      body { margin: 0; }
      main { max-width: 1040px; margin: auto; padding: 44px 24px 64px; }
      header { border-bottom: 2px solid #202020; padding-bottom: 24px; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      header p { margin: 0; color: #606060; overflow-wrap: anywhere; }
      section { padding: 28px 0; border-bottom: 1px solid #d9d9d9; }
      h2 { font-size: 19px; margin: 0 0 8px; }
      .endpoint { margin: 0 0 20px; color: #666; font: 13px/1.6 monospace; overflow-wrap: anywhere; }
      form { display: flex; align-items: end; gap: 12px; max-width: 620px; }
      label { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
      input { display: block; width: 100%; margin-top: 8px; border: 1px solid #aaa; border-radius: 4px; padding: 11px 12px; font: inherit; background: white; color: #202020; min-height: 44px; }
      button { min-height: 44px; padding: 11px 20px; border: 1px solid #202020; border-radius: 4px; background: #202020; color: white; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
      button:hover { background: #444; }
      button:disabled { opacity: .55; cursor: wait; }
      :focus-visible { outline: 3px solid #777; outline-offset: 3px; }
      .result { min-height: 24px; margin: 16px 0; font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
      .result[data-state="error"] { font-weight: 600; }
      .inspector { border-left: 3px solid #bcbcbc; background: #f0f0f0; padding: 14px 16px; }
      .inspector p { margin: 0 0 8px; font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
      .inspector strong { display: inline-block; min-width: 72px; }
      pre { margin: 10px 0 0; font: 12px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      .ratings:not(:empty) { margin-bottom: 20px; }
      .rating { border: 1px solid #d0d0d0; border-radius: 4px; padding: 16px; background: white; }
      .rating + .rating { margin-top: 12px; }
      .rating h3 { margin: 0 0 12px; font-size: 15px; }
      dl { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 13px; line-height: 1.6; }
      dt { color: #666; }
      dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 520px) {
        main { padding: 28px 16px 40px; }
        h1 { font-size: 24px; }
        form { flex-direction: column; align-items: stretch; }
        dl { grid-template-columns: 84px minmax(0, 1fr); gap: 8px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>UMC Movie API</h1>
        <p>Week 05 · Mock Frontend · http://localhost:3000</p>
      </header>

      <section id="nickname-section" aria-labelledby="nickname-title">
        <h2 id="nickname-title">닉네임 중복 확인</h2>
        <p class="endpoint">GET /members/nickname/:nickname</p>
        <form id="nickname-form">
          <label for="nickname">닉네임<input id="nickname" name="nickname" value="수현" required /></label>
          <button type="submit">중복 확인</button>
        </form>
        <p class="result" role="status" aria-live="polite">요청 대기</p>
        <div class="inspector">
          <p><strong>요청 URL</strong> <span class="request-url">—</span></p>
          <p><strong>HTTP 상태</strong> <span class="http-status">—</span></p>
          <pre class="response-json" aria-label="닉네임 응답 JSON">null</pre>
        </div>
      </section>

      <section id="email-section" aria-labelledby="email-title">
        <h2 id="email-title">이메일 중복 확인</h2>
        <p class="endpoint">GET /members/email/:email</p>
        <form id="email-form">
          <label for="email">이메일<input id="email" name="email" type="email" value="noco@umc.com" required /></label>
          <button type="submit">중복 확인</button>
        </form>
        <p class="result" role="status" aria-live="polite">요청 대기</p>
        <div class="inspector">
          <p><strong>요청 URL</strong> <span class="request-url">—</span></p>
          <p><strong>HTTP 상태</strong> <span class="http-status">—</span></p>
          <pre class="response-json" aria-label="이메일 응답 JSON">null</pre>
        </div>
      </section>

      <section id="ratings-section" aria-labelledby="ratings-title">
        <h2 id="ratings-title">회원별 평점 조회</h2>
        <p class="endpoint">GET /members/:memberId/ratings</p>
        <form id="ratings-form">
          <label for="member-id">회원 ID<input id="member-id" name="memberId" type="number" step="1" value="1" required /></label>
          <button type="submit">평점 조회</button>
        </form>
        <p class="result" role="status" aria-live="polite">요청 대기</p>
        <div class="ratings"></div>
        <div class="inspector">
          <p><strong>요청 URL</strong> <span class="request-url">—</span></p>
          <p><strong>HTTP 상태</strong> <span class="http-status">—</span></p>
          <pre class="response-json" aria-label="평점 응답 JSON">null</pre>
        </div>
      </section>
    </main>
    <script>
      'use strict';

      const API_BASE_URL = 'http://localhost:3000';

      function renderRatings(container, ratings) {
        container.replaceChildren();
        for (const rating of ratings) {
          const article = document.createElement('article');
          article.className = 'rating';
          const title = document.createElement('h3');
          title.textContent = `평점 #${rating.ratingId}`;
          const details = document.createElement('dl');
          for (const field of ['ratingId', 'movieId', 'score', 'comment', 'createdAt', 'updatedAt']) {
            const term = document.createElement('dt');
            term.textContent = field;
            const value = document.createElement('dd');
            value.textContent = rating[field] == null ? '—' : String(rating[field]);
            details.append(term, value);
          }
          article.append(title, details);
          container.append(article);
        }
      }

      function setupRequest(kind, inputId, createPath) {
        const section = document.getElementById(`${kind}-section`);
        const form = document.getElementById(`${kind}-form`);
        const input = document.getElementById(inputId);
        const button = form.querySelector('button');
        const result = section.querySelector('.result');
        const status = section.querySelector('.http-status');
        const json = section.querySelector('.response-json');
        const ratings = section.querySelector('.ratings');

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (button.disabled) return;
          const value = input.value.trim();
          if (!value) {
            result.textContent = '입력값을 확인해 주세요.';
            result.dataset.state = 'error';
            return;
          }

          const url = API_BASE_URL + createPath(encodeURIComponent(value));
          section.querySelector('.request-url').textContent = url;
          status.textContent = '요청 중';
          json.textContent = 'null';
          result.textContent = '응답을 기다리고 있습니다.';
          result.dataset.state = 'loading';
          if (ratings) ratings.replaceChildren();
          button.disabled = true;
          form.setAttribute('aria-busy', 'true');
          console.info(`[${kind}] GET ${url}`);

          try {
            const response = await fetch(url, {
              method: 'GET',
              signal: AbortSignal.timeout(15000),
            });
            status.textContent = `${response.status} ${response.statusText}`.trim();
            const raw = await response.text();
            let data;
            try {
              data = raw ? JSON.parse(raw) : null;
              json.textContent = JSON.stringify(data, null, 2);
            } catch {
              json.textContent = raw;
              console.error(`[${kind}] Invalid JSON`, response.status, raw);
              throw new Error(`HTTP ${response.status}: 응답이 올바른 JSON 형식이 아닙니다.`);
            }
            console.info(`[${kind}] Response`, { url, status: response.status, data });

            if (!response.ok) {
              const message = Array.isArray(data?.message) ? data.message.join(', ') : data?.message;
              if (response.status === 404 && kind === 'ratings') {
                throw new Error(`404 Not Found: 존재하지 않는 회원입니다.${message ? ` (${message})` : ''}`);
              }
              throw new Error(`HTTP ${response.status}: ${message || response.statusText || '요청에 실패했습니다.'}`);
            }

            if (kind === 'ratings') {
              if (!Array.isArray(data) || data.some((item) => !item || typeof item !== 'object' || Array.isArray(item))) {
                throw new Error('평점 목록 응답 형식이 올바르지 않습니다.');
              }
              renderRatings(ratings, data);
              result.textContent = data.length ? `평점 ${data.length}개를 조회했습니다.` : '작성한 평점이 없습니다.';
            } else {
              if (typeof data?.available !== 'boolean') throw new Error('available 응답 형식이 올바르지 않습니다.');
              const label = kind === 'nickname' ? '닉네임' : '이메일';
              result.textContent = data.available ? `사용 가능한 ${label}입니다.` : `이미 사용 중인 ${label}입니다. (중복)`;
            }
            result.dataset.state = 'success';
          } catch (error) {
            console.error(`[${kind}] Request failed`, { url, error });
            result.dataset.state = 'error';
            if (error instanceof TypeError || error.name === 'TimeoutError') {
              status.textContent = '확인 불가';
              result.textContent = error.name === 'TimeoutError'
                ? '요청 시간이 초과되었습니다. 서버 연결과 개발자 도구를 확인해 주세요.'
                : '응답을 읽을 수 없습니다. CORS 차단 또는 서버 연결 오류일 수 있습니다. 개발자 도구의 Console과 Network를 확인해 주세요.';
              json.textContent = '응답을 읽을 수 없어 JSON을 표시할 수 없습니다.';
            } else {
              result.textContent = error.message || '알 수 없는 오류가 발생했습니다.';
            }
          } finally {
            button.disabled = false;
            form.setAttribute('aria-busy', 'false');
          }
        });
      }

      setupRequest('nickname', 'nickname', (value) => `/members/nickname/${value}`);
      setupRequest('email', 'email', (value) => `/members/email/${value}`);
      setupRequest('ratings', 'member-id', (value) => `/members/${value}/ratings`);
    </script>
  </body>
</html>
